<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정원복 포트폴리오 | 고객 후기</title>
  <link rel="icon" href="img/logo/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 커스텀 마우스 커서 -->
  <div class="custom-cursor-dot"></div>
  <div class="custom-cursor-blur"></div>

  <!-- Header Navigation -->
  <header id="header" class="scrolled">
    <div class="logo"><a href="index.html" class="hover-target">JWB STUDIO</a></div>
    
    <div class="header-right-group">
      <a href="index.html" class="btn-resume-outline hover-target" style="padding:0.4rem 0.9rem;"><i class="fa-solid fa-house"></i> 메인으로</a>
      <button id="theme-toggle" class="theme-toggle-btn hover-target" aria-label="테마 변경">
        <i class="fa-solid fa-moon icon-dark"></i>
        <i class="fa-solid fa-sun icon-light"></i>
      </button>
    </div>
  </header>

  <div class="container" style="padding-top: 8rem;">
    <section class="scroll-reveal visible">
      <h2 class="section-title">고객 후기 (Reviews)</h2>
      <p style="color: var(--text-sub); margin-bottom: 2rem;">JWB STUDIO와 함께 프로젝트를 진행하신 고객님들의 소중한 후기 공간입니다.</p>

      <!-- 후기 작성 영역 (로그인 회원 전용) -->
      <div class="jwb-board-container" style="margin-bottom: 2.5rem;">
        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">소중한 후기를 남겨주세요</h3>
        
        <!-- 비로그인 시 노출되는 안내 메시지 -->
        <div id="review-login-required-msg" style="text-align: center; padding: 15px; color: var(--text-sub); display: none;">
          고객 후기 작성은 <strong style="color: var(--accent);">로그인한 회원</strong>만 가능합니다. 메인 페이지에서 로그인 후 이용해 주세요.
        </div>

        <!-- 로그인 회원만 보이는 후기 작성 폼 -->
        <form id="review-form" class="jwb-board-form" style="display: none;">
          <input type="text" id="review-author" placeholder="작성자" readonly style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-sub); cursor:not-allowed;">
          
          <div style="margin-bottom: 10px;">
            <label style="font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 4px;">별점 평가</label>
            <select id="review-rating" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-main);">
              <option value="5">★★★★★ (5점 - 매우 만족)</option>
              <option value="4">★★★★☆ (4점 - 만족)</option>
              <option value="3">★★★☆☆ (3점 - 보통)</option>
              <option value="2">★★☆☆☆ (2점 - 아쉬움)</option>
              <option value="1">★☆☆☆☆ (1점 - 매우 아쉬움)</option>
            </select>
          </div>

          <textarea id="review-content" placeholder="프로젝트 진행 소감이나 만족스러웠던 점을 남겨주세요." rows="3" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-main);"></textarea>
          
          <button type="submit" class="jwb-btn" style="width:100%; justify-content:center;">후기 등록하기</button>
        </form>
      </div>

      <!-- 후기 목록 출력 컨테이너 -->
      <div class="jwb-board-container">
        <ul id="review-list" class="jwb-post-list">
          <li style="text-align:center; padding:20px; color:var(--text-sub);">등록된 후기를 불러오는 중입니다...</li>
        </ul>
      </div>
      <div id="review-pagination" style="display: flex; justify-content: center; gap: 5px; margin-top: 1.5rem;"></div>
    </section>
  </div>

  <!-- 푸터 -->
  <footer>
    <p class="footer-notice">본 사이트는 상업적 목적이 아닌 개인 포트폴리오 사이트로 제작되었습니다.</p>
    <p class="footer-copy">&copy; 2026 JWB STUDIO. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://rktwmdtjboyihmrrajrc.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdHdtZHRqYm95aWhtcnJhanJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDQ0NTksImV4cCI6MjEwNTQ4MDQ1OX0.LdeCCKnAm5HJu8BlE40HEXuQ5rfJb067PfaA84kY1N0';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const currentUser = localStorage.getItem('jwb_user') || null;
      
      const reviewForm = document.getElementById('review-form');
      const reviewLoginMsg = document.getElementById('review-login-required-msg');
      const reviewAuthorInput = document.getElementById('review-author');

      // 로그인 상태에 따른 작성 권한 제어
      if (currentUser) {
        if (reviewForm) reviewForm.style.display = 'block';
        if (reviewLoginMsg) reviewLoginMsg.style.display = 'none';
        if (reviewAuthorInput) reviewAuthorInput.value = currentUser;
      } else {
        if (reviewForm) reviewForm.style.display = 'none';
        if (reviewLoginMsg) reviewLoginMsg.style.display = 'block';
      }

      // 후기 목록 불러오기
      let allReviews = [];
      let currentPage = 1;

      async function loadReviews() {
        const list = document.getElementById('review-list');
        if (!list) return;
        try {
          const { data: reviews, error } = await supabase.from('reviews').select('*');
          if (error || !reviews) {
            allReviews = [];
          } else {
            reviews.sort((a, b) => b.id - a.id);
            allReviews = reviews;
          }
          renderReviews();
        } catch (e) {
          list.innerHTML = '<li style="text-align:center;">후기를 불러오지 못했습니다.</li>';
        }
      }

      window.changeReviewPage = function(page) {
        currentPage = page;
        renderReviews();
      };

      function renderReviews() {
        const list = document.getElementById('review-list');
        if (!list) return;

        const totalPages = Math.ceil(allReviews.length / 5) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const currentItems = allReviews.slice((currentPage - 1) * 5, currentPage * 5);

        list.innerHTML = '';
        if (currentItems.length === 0) {
          list.innerHTML = '<li style="text-align:center; padding:20px; color:var(--text-sub);">아직 등록된 후기가 없습니다. 첫 후기를 남겨주세요!</li>';
          document.getElementById('review-pagination').innerHTML = '';
          return;
        }

        currentItems.forEach(r => {
          const stars = '★'.repeat(r.rating || 5) + '☆'.repeat(5 - (r.rating || 5));
          list.innerHTML += `
            <li class="jwb-post-item" style="padding: 15px; border-bottom: 1px solid var(--border);">
              <div class="jwb-post-header">
                <div>
                  <span style="color: #f1c40f; margin-right: 8px; font-size: 0.9rem;">${stars}</span>
                  <span class="jwb-post-title" style="font-weight:600; color:var(--text-main);">${r.author} 고객님</span>
                </div>
                <span class="jwb-post-meta" style="font-size:0.8rem; color:var(--text-sub);">${r.date || ''}</span>
              </div>
              <div class="jwb-post-content" style="margin-top:6px; font-size:0.95rem; color:var(--text-sub);">${r.content}</div>
            </li>
          `;
        });

        const pageContainer = document.getElementById('review-pagination');
        let btns = '';
        for (let i = 1; i <= totalPages; i++) {
          btns += `<button onclick="changeReviewPage(${i})" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:${i === currentPage ? 'var(--accent)' : 'var(--pill-bg)'}; color:#fff; cursor:pointer; font-weight:600; margin:0 2px;">${i}</button>`;
        }
        if (pageContainer) pageContainer.innerHTML = btns;
      }

      // 후기 등록 제출
      if (reviewForm) {
        reviewForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!currentUser) {
            alert('로그인한 회원만 후기를 작성할 수 있습니다.');
            return;
          }

          const rating = document.getElementById('review-rating').value;
          const content = document.getElementById('review-content').value;
          const date = new Date().toLocaleString();

          const { error } = await supabase.from('reviews').insert([
            { author: currentUser, rating: parseInt(rating), content: content, date: date }
          ]);

          if (!error) {
            alert('소중한 후기가 등록되었습니다!');
            reviewForm.reset();
            reviewAuthorInput.value = currentUser;
            loadReviews();
          } else {
            alert('후기 등록 실패: ' + error.message);
          }
        });
      }

      loadReviews();
    });
  </script>
</body>
</html>
