            <div class="policy-content">
                <p>JWB STUDIO는 이용자의 개인정보를 중요시하며, 안전하게 보호하기 위해 최선을 다하고 있습니다.</p>

                <p><strong>2. 개인정보의 수집 및 이용 목적</strong><br>
                회원 관리, 프로젝트 의뢰 확인, 상담 진행 및 견적 안내</p>
                <p><strong>3. 개인정보의 보유 및 이용 기간</strong><br>
                회원 탈퇴 시 또는 상담 종료 시 지체 없이 파기합니다.</p>
