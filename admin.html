<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWB STUDIO | 관리자 페이지 (Admin)</title>
  <link rel="icon" href="img/logo/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container { max-width: 1000px; margin: 0 auto; padding: 3rem 1.5rem; }
    .admin-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2.5rem; }
    .admin-section h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .admin-table th { color: var(--text-sub); font-weight: 700; background: var(--pill-bg); }
    .action-btn { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-right: 5px; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-delete { background: var(--accent); color: #fff; }
  </style>
</head>
<body class="dark-mode">

  <!-- 관리자 로그인 전용 모달 -->
  <div id="admin-login-overlay" class="modal-overlay active" style="z-index: 3000;">
    <div class="modal-content" style="max-width: 380px; padding: 2.5rem; background: var(--card-bg);">
      <h2 style="margin-bottom: 1.5rem; text-align:center; color:var(--text-main);">관리자 인증</h2>
      <form id="admin-login-form">
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-main);">
        <button type="submit" class="jwb-btn" style="width:100%; justify-content:center;">로그인</button>
      </form>
      <div style="margin-top: 15px; text-align: center;">
        <button type="button" onclick="location.href='index.html'" style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:0.85rem;">← 메인으로 돌아가기</button>
      </div>
    </div>
  </div>

  <!-- 관리자 대시보드 본문 -->
  <div id="admin-dashboard" class="admin-container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 900; color: var(--text-main);">JWB STUDIO ADMIN</h1>
      <div style="display: flex; gap: 10px;">
        <button id="admin-logout-btn" class="btn-resume-outline hover-target" style="border-color: var(--accent); color: var(--accent);">관리자 로그아웃</button>
        <button onclick="location.href='index.html'" class="btn-resume-outline hover-target">포트폴리오로 이동</button>
      </div>
    </div>

    <!-- 1. 관리자 비밀번호 변경 섹션 -->
    <div class="admin-section">
      <h2><i class="fa-solid fa-key"></i> 관리자 비밀번호 변경</h2>
      <form id="admin-pw-change-form" class="jwb-board-form">
        <input type="password" id="admin-current-pw" placeholder="현재 관리자 비밀번호" required>
        <input type="password" id="admin-new-pw" placeholder="새로운 관리자 비밀번호" required>
        <input type="password" id="admin-new-pw-check" placeholder="새로운 관리자 비밀번호 확인" required>
        <button type="submit" class="jwb-btn" style="width: auto;">비밀번호 변경</button>
      </form>
    </div>

    <!-- 2. 공지사항 관리 -->
    <div class="admin-section">
      <h2><i class="fa-solid fa-bullhorn"></i> 공지사항 등록 / 수정</h2>
      <form id="admin-notice-form" class="jwb-board-form">
        <input type="hidden" id="notice-id">
        <input type="text" id="notice-title" placeholder="공지사항 제목" required>
        <textarea id="notice-content" placeholder="공지사항 내용" rows="4" required></textarea>
        <div style="display:flex; gap:10px;">
          <button type="submit" id="notice-submit-btn" class="jwb-btn">공지 등록</button>
          <button type="button" id="notice-cancel-btn" class="btn-resume-outline" style="display:none;" onclick="resetNoticeForm()">수정 취소</button>
        </div>
      </form>

      <h3 style="margin-top:2rem; font-size:1.1rem; color:var(--text-main);">등록된 공지사항 목록</h3>
      <table class="admin-table">
        <thead><tr><th>ID</th><th>제목</th><th>등록일</th><th>관리</th></tr></thead>
        <tbody id="admin-notice-list"></tbody>
      </table>
    </div>

    <!-- 3. 포트폴리오 관리 -->
    <div class="admin-section">
      <h2><i class="fa-solid fa-film"></i> 포트폴리오 등록 / 수정</h2>
      <form id="admin-portfolio-form" class="jwb-board-form">
        <input type="hidden" id="pf-id">
        <input type="text" id="pf-title" placeholder="작품 제목" required>
        <select id="pf-category" style="width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--pill-bg); color: var(--text-main);" required>
          <option value="">카테고리 시스템 코드 선택</option>
          <option value="video">영상 편집 (video)</option>
          <option value="ad">광고 / 프로모션 (ad)</option>
          <option value="3d">3D 아트워크 (3d)</option>
          <option value="graphic">그래픽 / 이미지 (graphic)</option>
          <option value="typo">타이포그래피 (typo)</option>
          <option value="motion">모션 그래픽 (motion)</option>
          <option value="web">웹 / 인터랙티브 (web)</option>
          <option value="vfx">VFX / 씬 (vfx)</option>
        </select>
        <input type="text" id="pf-category-name" placeholder="카테고리 한글명 (예: 모션 그래픽)" required>
        <input type="text" id="pf-work-time" placeholder="작업 시간 (예: 2주 소요)" required>
        <input type="text" id="pf-link" placeholder="유튜브 링크 또는 영상 URL" required>
        <input type="text" id="pf-thumb" placeholder="커스텀 썸네일 이미지 URL (선택사항)">
        <input type="text" id="pf-tools" placeholder="사용 툴 (예: After Effects, Blender)" required>
        <textarea id="pf-desc" placeholder="작품 상세 설명" rows="3" required></textarea>
        <div style="display:flex; gap:10px;">
          <button type="submit" id="pf-submit-btn" class="jwb-btn">포트폴리오 등록</button>
          <button type="button" id="pf-cancel-btn" class="btn-resume-outline" style="display:none;" onclick="resetPortfolioForm()">수정 취소</button>
        </div>
      </form>

      <h3 style="margin-top:2rem; font-size:1.1rem; color:var(--text-main);">등록된 포트폴리오 목록</h3>
      <table class="admin-table">
        <thead><tr><th>ID</th><th>제목</th><th>카테고리</th><th>관리</th></tr></thead>
        <tbody id="admin-portfolio-list"></tbody>
      </table>
    </div>

    <!-- 4. 회원 목록 조회 -->
    <div class="admin-section">
      <h2><i class="fa-solid fa-users"></i> 회원 목록 조회</h2>
      <div style="overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr><th>아이디</th><th>이름</th><th>마케팅 동의</th><th>가입일시</th></tr>
          </thead>
          <tbody id="admin-user-list">
            <tr><td colspan="4" style="text-align: center; color: var(--text-sub);">회원 정보를 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rktwmdtjboyihmrrajrc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdHdtZHRqYm95aWhtcnJhanJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDQ0NTksImV4cCI6MjEwNTQ4MDQ1OX0.LdeCCKnAm5HJu8BlE40HEXuQ5rfJb067PfaA84kY1N0';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const adminLoginOverlay = document.getElementById('admin-login-overlay');
    const adminDashboard = document.getElementById('admin-dashboard');

    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function checkAdminAuth() {
      if (sessionStorage.getItem('jwb_admin_auth') === 'true') {
        adminLoginOverlay.classList.remove('active');
        adminDashboard.style.display = 'block';
        loadAdminData();
      } else {
        adminLoginOverlay.classList.add('active');
        adminDashboard.style.display = 'none';
      }
    }
    checkAdminAuth();

    // 관리자 로그인 처리 (Supabase DB 연동: userid = 'admin')
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwInput = document.getElementById('admin-pw').value;

      try {
        const hashedPassword = await hashPassword(pwInput);
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('userid', 'admin')
          .eq('password', hashedPassword)
          .single();

        if (!error && data) {
          sessionStorage.setItem('jwb_admin_auth', 'true');
          checkAdminAuth();
        } else {
          alert('관리자 비밀번호가 일치하지 않습니다. (Supabase users 테이블에 id: admin 계정이 있는지 확인해주세요)');
        }
      } catch (err) {
        alert('로그인 오류 발생: ' + err.message);
      }
    });

    document.getElementById('admin-logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('jwb_admin_auth');
      location.reload();
    });

    // 관리자 비밀번호 변경 처리
    const adminPwChangeForm = document.getElementById('admin-pw-change-form');
    if (adminPwChangeForm) {
      adminPwChangeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPw = document.getElementById('admin-current-pw').value;
        const newPw = document.getElementById('admin-new-pw').value;
        const newPwCheck = document.getElementById('admin-new-pw-check').value;

        if (newPw !== newPwCheck) {
          return alert('새로운 비밀번호가 서로 일치하지 않습니다.');
        }

        try {
          const hashedCurrentPw = await hashPassword(currentPw);
          const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('userid', 'admin')
            .eq('password', hashedCurrentPw)
            .single();

          if (error || !data) {
            return alert('현재 관리자 비밀번호가 올바르지 않습니다.');
          }

          const hashedNewPw = await hashPassword(newPw);
          const { error: updateError } = await supabaseClient
            .from('users')
            .update({ password: hashedNewPw })
            .eq('userid', 'admin');

          if (!updateError) {
            alert('관리자 비밀번호가 성공적으로 변경되었습니다. 다시 로그인해 주세요.');
            sessionStorage.removeItem('jwb_admin_auth');
            location.reload();
          } else {
            alert('비밀번호 변경 실패: ' + updateError.message);
          }
        } catch (err) {
          alert('처리 중 오류가 발생했습니다.');
        }
      });
    }

    async function loadAdminData() {
      try {
        // 1. 회원 목록
        const { data: users } = await supabaseClient.from('users').select('*');
        const userList = document.getElementById('admin-user-list');
        userList.innerHTML = users?.length ? '' : '<tr><td colspan="4" style="text-align:center;">등록된 회원이 없습니다.</td></tr>';
        users?.forEach(u => {
          userList.innerHTML += `<tr><td>${u.userid}</td><td>${u.username}</td><td>${u.marketing ? '동의' : '미동의'}</td><td>${u.created_at || '-'}</td></tr>`;
        });

        // 2. 공지사항 관리 목록
        const { data: notices } = await supabaseClient.from('notices').select('*');
        if (notices) notices.sort((a, b) => b.id - a.id);
        const noticeList = document.getElementById('admin-notice-list');
        noticeList.innerHTML = notices?.length ? '' : '<tr><td colspan="4" style="text-align:center;">등록된 공지가 없습니다.</td></tr>';
        notices?.forEach(n => {
          const safeTitle = (n.title || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeContent = (n.content || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;").replace(/\n/g, "\\n");
          noticeList.innerHTML += `<tr><td>${n.id}</td><td>${n.title}</td><td>${n.date}</td><td>
            <button class="action-btn btn-edit" onclick="editNotice(${n.id}, '${safeTitle}', '${safeContent}')">수정</button>
            <button class="action-btn btn-delete" onclick="deleteNotice(${n.id})">삭제</button>
          </td></tr>`;
        });

        // 3. 포트폴리오 관리 목록
        const { data: portfolios } = await supabaseClient.from('portfolios').select('*');
        if (portfolios) portfolios.sort((a, b) => b.id - a.id);
        const pfList = document.getElementById('admin-portfolio-list');
        pfList.innerHTML = portfolios?.length ? '' : '<tr><td colspan="4" style="text-align:center;">등록된 작품이 없습니다.</td></tr>';
        portfolios?.forEach(p => {
          const safeTitle = (p.title || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeCategoryName = (p.category_name || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeWorkTime = (p.work_time || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeLink = (p.link || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeThumb = (p.thumb || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeTools = (p.tools || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
          const safeDesc = (p.desc || '').replace(/'/g, "&apos;").replace(/"/g, "&quot;").replace(/\n/g, "\\n");

          pfList.innerHTML += `<tr><td>${p.id}</td><td>${p.title}</td><td>${p.category_name || p.category}</td><td>
            <button class="action-btn btn-edit" onclick="editPortfolio(${p.id}, '${safeTitle}', '${p.category}', '${safeCategoryName}', '${safeWorkTime}', '${safeLink}', '${safeThumb}', '${safeTools}', '${safeDesc}')">수정</button>
            <button class="action-btn btn-delete" onclick="deletePortfolio(${p.id})">삭제</button>
          </td></tr>`;
        });
      } catch (err) {
        console.error("데이터 로드 에러:", err);
      }
    }

    // 공지사항 등록 및 수정 처리
    document.getElementById('admin-notice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('notice-id').value;
      const title = document.getElementById('notice-title').value;
      const content = document.getElementById('notice-content').value;
      const date = new Date().toLocaleDateString();

      try {
        if (id && id.trim() !== "") {
          const { error } = await supabaseClient.from('notices').update({ title, content }).eq('id', id);
          if (!error) alert('공지사항이 수정되었습니다.');
          else alert('수정 실패: ' + error.message);
        } else {
          const { error } = await supabaseClient.from('notices').insert([{ title, content, date }]);
          if (!error) alert('공지사항이 등록되었습니다.');
          else alert('등록 실패: ' + error.message);
        }
        resetNoticeForm();
        loadAdminData();
      } catch (err) {
        alert('네트워크 오류 발생');
      }
    });

    window.editNotice = (id, title, content) => {
      document.getElementById('notice-id').value = id;
      document.getElementById('notice-title').value = title;
      document.getElementById('notice-content').value = content;
      document.getElementById('notice-submit-btn').textContent = '공지 수정 완료';
      document.getElementById('notice-cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetNoticeForm = () => {
      document.getElementById('admin-notice-form').reset();
      document.getElementById('notice-id').value = '';
      document.getElementById('notice-submit-btn').textContent = '공지 등록';
      document.getElementById('notice-cancel-btn').style.display = 'none';
    };

    window.deleteNotice = async (id) => {
      if (confirm(`공지 ID [${id}]번을 정말 삭제하시겠습니까?`)) {
        const { error } = await supabaseClient.from('notices').delete().eq('id', id);
        if (!error) {
          alert('삭제되었습니다.');
          loadAdminData();
        } else {
          alert('삭제 실패: ' + error.message);
        }
      }
    };

    // 포트폴리오 등록 및 수정 처리
    document.getElementById('admin-portfolio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('pf-id').value;
      const payload = {
        title: document.getElementById('pf-title').value,
        category: document.getElementById('pf-category').value,
        category_name: document.getElementById('pf-category-name').value,
        work_time: document.getElementById('pf-work-time').value,
        link: document.getElementById('pf-link').value,
        thumb: document.getElementById('pf-thumb').value,
        tools: document.getElementById('pf-tools').value,
        desc: document.getElementById('pf-desc').value
      };

      try {
        if (id && id.trim() !== "") {
          const { error } = await supabaseClient.from('portfolios').update(payload).eq('id', id);
          if (!error) alert('포트폴리오가 수정되었습니다.');
          else alert('수정 실패: ' + error.message);
        } else {
          const { error } = await supabaseClient.from('portfolios').insert([payload]);
          if (!error) alert('포트폴리오가 등록되었습니다.');
          else alert('등록 실패: ' + error.message);
        }
        resetPortfolioForm();
        loadAdminData();
      } catch (err) {
        alert('네트워크 오류 발생');
      }
    });

    window.editPortfolio = (id, title, category, categoryName, workTime, link, thumb, tools, desc) => {
      document.getElementById('pf-id').value = id;
      document.getElementById('pf-title').value = title;
      document.getElementById('pf-category').value = category;
      document.getElementById('pf-category-name').value = categoryName;
      document.getElementById('pf-work-time').value = workTime;
      document.getElementById('pf-link').value = link;
      document.getElementById('pf-thumb').value = thumb;
      document.getElementById('pf-tools').value = tools;
      document.getElementById('pf-desc').value = desc;
      document.getElementById('pf-submit-btn').textContent = '포트폴리오 수정 완료';
      document.getElementById('pf-cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetPortfolioForm = () => {
      document.getElementById('admin-portfolio-form').reset();
      document.getElementById('pf-id').value = '';
      document.getElementById('pf-submit-btn').textContent = '포트폴리오 등록';
      document.getElementById('pf-cancel-btn').style.display = 'none';
    };

    window.deletePortfolio = async (id) => {
      if (confirm(`포트폴리오 ID [${id}]번을 정말 삭제하시겠습니까?`)) {
        const { error } = await supabaseClient.from('portfolios').delete().eq('id', id);
        if (!error) {
          alert('삭제되었습니다.');
          loadAdminData();
        } else {
          alert('삭제 실패: ' + error.message);
        }
      }
    };
  </script>
</body>
</html>
