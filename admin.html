<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWB STUDIO | 관리자 대시보드</title>
  <link rel="icon" href="img/logo/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-wrapper {
      max-width: 1000px;
      margin: 8rem auto 4rem;
      padding: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .admin-section {
      margin-bottom: 2.5rem;
      background: var(--pill-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .admin-section h3 {
      margin-bottom: 1rem;
      color: var(--accent);
      font-size: 1.2rem;
    }
    .admin-form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .admin-form-group input, .admin-form-group textarea, .admin-form-group select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .admin-table th, .admin-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .admin-table th {
      background: var(--card-bg);
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header id="header" class="scrolled">
    <div class="logo"><a href="index.html">JWB STUDIO [ADMIN]</a></div>
    <div class="header-right-group">
      <a href="index.html" class="btn-resume-outline" style="padding:0.4rem 1rem;"><i class="fa-solid fa-house"></i> 메인으로 돌아가기</a>
      <button id="admin-logout-btn" class="btn-resume-outline" style="display:none; padding:0.4rem 1rem; border-color:var(--accent); color:var(--accent);">관리자 로그아웃</button>
    </div>
  </header>

  <div class="container">
    
    <!-- 1. 관리자 로그인 영역 (로그인 전) -->
    <div id="admin-login-container" style="max-width: 400px; margin: 10rem auto; padding: 2.5rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; text-align: center;">
      <h2 style="margin-bottom: 1.5rem; color: var(--text-main);">관리자 로그인</h2>
      <form id="admin-login-form">
        <input type="text" id="admin-id" placeholder="관리자 아이디" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-main);">
        <input type="password" id="admin-pw" placeholder="비밀번호" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background:var(--pill-bg); color:var(--text-main);">
        <button type="submit" class="jwb-btn" style="width:100%; justify-content:center;">로그인</button>
      </form>
    </div>

    <!-- 2. 관리자 대시보드 영역 (로그인 후) -->
    <div id="admin-dashboard-container" class="admin-wrapper" style="display: none;">
      <div class="admin-header">
        <h2>관리자 대시보드</h2>
        <span id="admin-welcome-text" style="color: var(--text-sub); font-weight: 600;">최고관리자님 환영합니다.</span>
      </div>

      <!-- 공지사항 등록 섹션 -->
      <div class="admin-section">
        <h3>공지사항 등록</h3>
        <form id="admin-notice-form">
          <div class="admin-form-group">
            <select id="notice-cat">
              <option value="공지">공지</option>
              <option value="안내">안내</option>
              <option value="업데이트">업데이트</option>
              <option value="일반">일반</option>
            </select>
            <input type="text" id="notice-title" placeholder="공지사항 제목" required>
            <textarea id="notice-content" placeholder="공지사항 내용을 입력하세요" rows="4" required></textarea>
            <div>
              <label style="font-size:0.85rem; color:var(--text-sub); display:block; margin-bottom:4px;">첨부파일 (구글 드라이브 연동)</label>
              <input type="file" id="notice-file-input">
              <input type="hidden" id="notice-file-name">
              <input type="hidden" id="notice-file-url">
              <input type="hidden" id="notice-file-size">
            </div>
            <button type="submit" class="jwb-btn">공지 등록하기</button>
          </div>
        </form>
      </div>

      <!-- 포트폴리오 등록 섹션 -->
      <div class="admin-section">
        <h3>포트폴리오 등록</h3>
        <form id="admin-portfolio-form">
          <div class="admin-form-group">
            <input type="text" id="pf-title" placeholder="작품 제목" required>
            <select id="pf-category">
              <option value="video">영상 편집 (video)</option>
              <option value="ad">광고 / 프로모션 (ad)</option>
              <option value="3d">3D 아트워크 (3d)</option>
              <option value="graphic">그래픽 / 이미지 (graphic)</option>
              <option value="typo">타이포그래피 (typo)</option>
              <option value="motion">모션 그래픽 (motion)</option>
              <option value="web">웹 / 인터랙티브 (web)</option>
              <option value="vfx">VFX / 씬 (vfx)</option>
            </select>
            <input type="text" id="pf-category-name" placeholder="카테고리 표시 이름 (예: MOTION GRAPHICS)" required>
            <input type="text" id="pf-link" placeholder="유튜브 링크 또는 영상 URL" required>
            <input type="text" id="pf-tools" placeholder="사용 툴 (콤마로 구분, 예: After Effects, Blender)">
            <input type="text" id="pf-work-time" placeholder="작업 기간 (예: 2주 소요)">
            <input type="text" id="pf-thumb" placeholder="커스텀 썸네일 이미지 URL (선택사항)">
            <textarea id="pf-desc" placeholder="작품 상세 설명" rows="3" required></textarea>
            <button type="submit" class="jwb-btn">포트폴리오 등록하기</button>
          </div>
        </form>
      </div>

      <!-- 회원 관리 섹션 -->
      <div class="admin-section">
        <h3>가입 회원 목록</h3>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>가입일시</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="admin-user-list">
              <tr><td colspan="4" style="text-align:center; color:var(--text-sub);">회원 목록을 불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://rktwmdtjboyihmrrajrc.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdHdtZHRqYm95aWhtcnJhanJjIiwicm9sZSI6InJub24iLCJpYXQiOjE3ODk5MDQ0NTksImV4cCI6MjEwNTQ4MDQ1OX0.LdeCCKnAm5HJu8BlE40HEXuQ5rfJb067PfaA84kY1N0';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzcD0H9nJ7_Xg5QrJrjoMQaQOS8E0Nj82tYXzq5EK_-_n1rwbkMyACe0NfCb22-uP5p/exec";

      async function hashPassword(password) {
        const msgUint8 = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      const loginContainer = document.getElementById('admin-login-container');
      const dashboardContainer = document.getElementById('admin-dashboard-container');
      const logoutBtn = document.getElementById('admin-logout-btn');

      let isAdminLoggedIn = localStorage.getItem('jwb_admin_logged') === 'true';

      function updateAdminUI() {
        if (isAdminLoggedIn) {
          if(loginContainer) loginContainer.style.display = 'none';
          if(dashboardContainer) dashboardContainer.style.display = 'block';
          if(logoutBtn) logoutBtn.style.display = 'inline-block';
          loadUsersList();
        } else {
          if(loginContainer) loginContainer.style.display = 'block';
          if(dashboardContainer) dashboardContainer.style.display = 'none';
          if(logoutBtn) logoutBtn.style.display = 'none';
        }
      }
      updateAdminUI();

      // 관리자 로그인 처리 (아이디: admin, 비밀번호: 1234 또는 DB 확인)
      const adminLoginForm = document.getElementById('admin-login-form');
      if (adminLoginForm) {
        adminLoginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const inputId = document.getElementById('admin-id').value;
          const inputPw = document.getElementById('admin-pw').value;

          // 간단한 관리자 계정 하드코딩 인증 (또는 DB 조회 연동 가능)
          if (inputId === 'admin' && inputPw === '1234') {
            isAdminLoggedIn = true;
            localStorage.setItem('jwb_admin_logged', 'true');
            alert('관리자 로그인 성공!');
            updateAdminUI();
          } else {
            // Supabase users 테이블에서 관리자 권한 확인 (선택사항)
            const hashedPw = await hashPassword(inputPw);
            const { data, error } = await supabase
              .from('users')
              .select('*')
              .eq('userid', inputId)
              .eq('password', hashedPw)
              .single();

            if (!error && data && data.userid === 'admin') {
              isAdminLoggedIn = true;
              localStorage.setItem('jwb_admin_logged', 'true');
              alert('관리자 로그인 성공!');
              updateAdminUI();
            } else {
              alert('관리자 권한이 없거나 아이디/비밀번호가 틀렸습니다.');
            }
          }
        });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('jwb_admin_logged');
          isAdminLoggedIn = false;
          updateAdminUI();
          alert('관리자 로그아웃 되었습니다.');
        });
      }

      // 공지사항 파일 업로드 핸들러
      document.getElementById('notice-file-input')?.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
          try {
            const res = await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              body: JSON.stringify({ fileName: file.name, mimeType: file.type, fileData: reader.result.split(',')[1] })
            });
            const result = await res.json();
            if (result.status === 'success') {
              document.getElementById('notice-file-name').value = file.name;
              document.getElementById('notice-file-url').value = result.url;
              document.getElementById('notice-file-size').value = (file.size / 1024).toFixed(1) + 'KB';
              alert('공지 첨부파일 구글 드라이브 업로드 완료!');
            } else {
              alert('업로드 실패: ' + result.message);
            }
          } catch (err) {
            alert('파일 업로드 통신 오류 발생');
          }
        };
      });

      // 공지 등록 폼 제출
      document.getElementById('admin-notice-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          category: document.getElementById('notice-cat').value,
          title: document.getElementById('notice-title').value,
          content: document.getElementById('notice-content').value,
          file_name: document.getElementById('notice-file-name').value || null,
          file_url: document.getElementById('notice-file-url').value || null,
          file_size: document.getElementById('notice-file-size').value || null,
          download_count: 0,
          date: new Date().toLocaleDateString()
        };

        const { error } = await supabase.from('notices').insert([payload]);
        if (!error) {
          alert('공지사항이 정상 등록되었습니다!');
          e.target.reset();
          document.getElementById('notice-file-name').value = '';
          document.getElementById('notice-file-url').value = '';
          document.getElementById('notice-file-size').value = '';
        } else {
          alert('등록 실패: ' + error.message);
        }
      });

      // 포트폴리오 등록 폼 제출
      document.getElementById('admin-portfolio-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          title: document.getElementById('pf-title').value,
          category: document.getElementById('pf-category').value,
          category_name: document.getElementById('pf-category-name').value,
          link: document.getElementById('pf-link').value,
          tools: document.getElementById('pf-tools').value,
          work_time: document.getElementById('pf-work-time').value,
          thumb: document.getElementById('pf-thumb').value,
          desc: document.getElementById('pf-desc').value
        };

        const { error } = await supabase.from('portfolios').insert([payload]);
        if (!error) {
          alert('포트폴리오가 정상 등록되었습니다!');
          e.target.reset();
        } else {
          alert('등록 실패: ' + error.message);
        }
      });

      // 회원 목록 불러오기 및 강제 탈퇴 기능
      async function loadUsersList() {
        const tbody = document.getElementById('admin-user-list');
        if (!tbody) return;

        const { data: users, error } = await supabase.from('users').select('*');
        if (error || !users) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">회원 목록을 불러오지 못했습니다.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">가입된 회원이 없습니다.</td></tr>';
          return;
        }

        users.forEach(u => {
          tbody.innerHTML += `
            <tr>
              <td>${u.userid}</td>
              <td>${u.username}</td>
              <td>${u.created_at || '-'}</td>
              <td><button onclick="deleteUser('${u.userid}')" style="background:var(--accent); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.8rem;">탈퇴</button></td>
            </tr>
          `;
        });
      }

      window.deleteUser = async function(userid) {
        if (!confirm(`[ ${userid} ] 회원을 강제 탈퇴시키겠습니까?`)) return;
        const { error } = await supabase.from('users').delete().eq('userid', userid);
        if (!error) {
          alert('회원이 탈퇴 처리되었습니다.');
          loadUsersList();
        } else {
          alert('처리에 실패했습니다.');
        }
      };

    });
  </script>
</body>
</html>
